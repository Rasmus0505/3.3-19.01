<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i+1 原则数据可视化</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary-bg: #f4f7f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --accent-blue: #3A77FF;
            --accent-green: #00D084;
            --accent-red: #FF4D4F;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft Yahei', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .header h1 { margin: 0 0 10px 0; color: #1a1a1a; font-size: 28px; }
        .header p { color: var(--text-sub); font-size: 15px; line-height: 1.6; }

        .dashboard {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 24px;
            position: relative;
        }

        .chart-container {
            width: 100%;
            height: 400px;
        }

        .data-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>可理解性输入 (i+1 原则) 数据模型</h1>
        <p>克拉申(Krashen)的二语习得假说：学习者只有接触到略高于其当前水平 <b>(i)</b>，且能通过上下文理解的语言材料 <b>(+1)</b> 时，学习效率才能达到最大化。</p>
    </div>

    <div class="dashboard">
        
        <!-- 图表 1：学习效能曲线 -->
        <div class="card">
            <h3 style="margin-top: 0;">模型 1：难度与吸收率的【倒U型曲线】</h3>
            <div id="curveChart" class="chart-container"></div>
            <p style="font-size: 13px; color: #888; text-align: center; margin-bottom: 0;">
                <span class="data-tag" style="background: var(--accent-blue);">数据洞察</span> 
                认知负荷过低（i）或过高（i+10）都会导致吸收率无限趋近于0。最高效能点严格锁定在略具挑战的 i+1 区域。
            </p>
        </div>

        <!-- 图表 2：词汇覆盖率成分 -->
        <div class="card">
            <h3 style="margin-top: 0;">模型 2：语言材料成分结构【数据堆叠图】</h3>
            <div id="barChart" class="chart-container" style="height: 300px;"></div>
            <p style="font-size: 13px; color: #888; text-align: center; margin-bottom: 0;">
                <span class="data-tag" style="background: var(--accent-green);">实战应用</span> 
                在实际阅读中，"i+1" 的量化指标通常体现为：95% 的已知基础数据支撑推测 5% 的未知新数据。
            </p>
        </div>

    </div>

    <script>
        // ==========================================
        // 图表 1：学习效能曲线 (倒U型)
        // ==========================================
        var curveChart = echarts.init(document.getElementById('curveChart'));
        var curveOption = {
            tooltip: {
                trigger: 'axis',
                formatter: function (params) {
                    return `<b>${params[0].name}</b><br/>知识吸收效率：${params[0].value}%`;
                }
            },
            grid: { left: '5%', right: '5%', bottom: '10%', containLabel: true },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['i-1 (过于简单)', 'i (当前水平)', 'i+1 (最佳挑战)', 'i+5 (困难超载)', 'i+10 (完全听天书)'],
                axisLabel: { fontSize: 13, fontWeight: 'bold', color: '#555' }
            },
            yAxis: {
                type: 'value',
                name: '知识吸收效率 (%)',
                max: 120, // 留出顶部空间给标记点
                axisLabel: { formatter: '{value} %' }
            },
            series: [
                {
                    name: '吸收率',
                    type: 'line',
                    smooth: true, // 平滑曲线
                    symbol: 'circle',
                    symbolSize: 8,
                    data: [5, 20, 100, 25, 2], // 核心数据点，构成倒U型
                    itemStyle: { color: '#3A77FF' },
                    lineStyle: { width: 4 },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(58, 119, 255, 0.6)' },
                            { offset: 1, color: 'rgba(58, 119, 255, 0.05)' }
                        ])
                    },
                    markPoint: {
                        data: [
                            { 
                                type: 'max', 
                                name: '最大值',
                                symbolSize: 70,
                                itemStyle: { color: '#FF4D4F' },
                                label: { formatter: '峰值区\n(i+1)', color: '#fff', fontSize: 12, fontWeight: 'bold' }
                            }
                        ]
                    }
                }
            ]
        };
        curveChart.setOption(curveOption);

        // ==========================================
        // 图表 2：词汇覆盖率成分 (堆叠柱状图)
        // ==========================================
        var barChart = echarts.init(document.getElementById('barChart'));
        var barOption = {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { data: ['已知内容 (i)', '可推测的新知 (+1)', '无法理解的超纲内容 (噪音)'], bottom: 0 },
            grid: { left: '5%', right: '5%', bottom: '15%', top: '10%', containLabel: true },
            xAxis: {
                type: 'value',
                name: '内容占比',
                max: 100,
                axisLabel: { formatter: '{value} %' }
            },
            yAxis: {
                type: 'category',
                data: ['无效输入 (太难 i+10)', '高效输入 (最佳 i+1)', '无效输入 (原地踏步 i)'],
                axisLabel: { fontWeight: 'bold' }
            },
            series: [
                {
                    name: '已知内容 (i)',
                    type: 'bar',
                    stack: 'total',
                    label: { show: true, formatter: '{c}%' },
                    itemStyle: { color: '#3A77FF' }, // 蓝色
                    data: [40, 95, 100]
                },
                {
                    name: '可推测的新知 (+1)',
                    type: 'bar',
                    stack: 'total',
                    label: { show: true, formatter: '{c}%' },
                    itemStyle: { color: '#00D084' }, // 绿色
                    data: [0, 5, 0]
                },
                {
                    name: '无法理解的超纲内容 (噪音)',
                    type: 'bar',
                    stack: 'total',
                    label: { show: true, formatter: '{c}%' },
                    itemStyle: { color: '#FF4D4F' }, // 红色
                    data: [60, 0, 0]
                }
            ]
        };
        barChart.setOption(barOption);

        // 窗口缩放时自适应图表大小
        window.addEventListener('resize', function() {
            curveChart.resize();
            barChart.resize();
        });
    </script>
</body>
</html>
